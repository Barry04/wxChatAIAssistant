# pre-commit 配置：提交前本地快速静态检查。
# 安装：pip install -r requirements-dev.txt && pre-commit install
# 说明：完整验证（pytest --cov + 前端 lint/build）由 .github/workflows/ci.yml 承担，
#       这里只保留秒级检查，避免拖慢每次提交。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        args: [--fix]
